name: ultraviolet
version: 1.1.8

authors:
  - Dominic <dsisnero@gmail.com>

crystal: ">= 1.19.1"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
  # Examples encode images; mosaic only carries this as its own dev dependency,
  # so declare it here or a fresh `shards install` cannot build examples/image.cr
  # or examples/rgbimage.cr.
  stumpy_png:
    github: stumpycr/stumpy_png
  # Golden compares snapshots and rewrites them with GOLDEN_UPDATE=1.
  golden:
    github: dsisnero/golden

dependencies:
  colorful:
    github: dsisnero/colorful
  mosaic:
    github: dsisnero/mosaic
  ansi:
    github: dsisnero/ansi
  terminfo:
    github: dsisnero/terminfo
    version: 0.8.2
  uniwidth:
    github: naqvis/uni_char_width
  # Required directly by src/ (event decoding, styled strings, screen context).
  # It used to arrive only through `ansi`; ansi has since vendored its own UAX #29
  # splitter and dropped this. Declare it rather than rely on `uniwidth` pulling
  # it in: the input decoder needs a *non-GB9c* segmenter to match Go, whose
  # decoder uses `uniseg` and splits an Indic conjunct at the virama, while ansi's
  # splitter (like Go's width code, via `uax29`) merges it: "स्ते" is 2 events in
  # the Go decoder and 1 cluster in the width code.
  textseg:
    github: naqvis/uni_text_seg
    version: 0.1.3
