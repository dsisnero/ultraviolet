name: ultraviolet
version: 1.1.4

authors:
  - Dominic <dsisnero@gmail.com>

crystal: ">= 1.19.1"

license: MIT

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
  # Examples encode images; mosaic only carries this as its own dev dependency,
  # so declare it here or a fresh `shards install` cannot build examples/image.cr
  # or examples/rgbimage.cr.
  stumpy_png:
    github: stumpycr/stumpy_png
  # Golden compares snapshots and rewrites them with GOLDEN_UPDATE=1.
  golden:
    github: dsisnero/golden

dependencies:
  colorful:
    github: dsisnero/colorful
  mosaic:
    github: dsisnero/mosaic
  ansi:
    github: dsisnero/ansi
  terminfo:
    github: dsisnero/terminfo
    version: 0.8.2
  uniwidth:
    github: naqvis/uni_char_width
